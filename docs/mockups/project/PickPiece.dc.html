<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update – Pick a piece</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#175474}a:hover{color:#0f3a50}
button,input{font-family:inherit}
input::placeholder{color:#6B7580}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E151C; font-family: Inter, system-ui, sans-serif; color: #16202A; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="height: 270px; flex: 0 0 auto; position: relative; overflow: hidden">
    <svg aria-hidden="true" width="390" height="270" viewBox="0 120 366 254" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0">
      <rect y="0" width="366" height="520" fill="#55606B"></rect>
      <rect y="320" width="366" height="200" fill="#3D464F"></rect>
      <ellipse cx="183" cy="330" rx="120" ry="12" fill="rgba(14,21,28,0.35)"></ellipse>
      <g transform="translate(75 150) scale(1.5)">
        <path d="M82 50 c16 0 16 28 0 28" fill="none" stroke="#A0907F" stroke-width="7" stroke-linecap="round"></path>
        <path d="M30 38 h52 v50 a8 8 0 0 1 -8 8 h-36 a8 8 0 0 1 -8 -8 z" fill="#A0907F"></path>
        <ellipse cx="56" cy="38" rx="26" ry="4" fill="#8E7F72"></ellipse>
      </g>
    </svg>
    <a href="Capture.dc.html" style="position: absolute; top: 52px; left: 20px; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(14,21,28,0.6); color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; text-decoration: none">Retake</a>
    <span style="position: absolute; top: 58px; right: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #FFFFFF; background: rgba(14,21,28,0.6); padding: 6px 12px; border-radius: 12px">Update a piece</span>
  </div>

  <div style="flex: 1 1 auto; margin-top: -28px; background: #EEF1F4; border-radius: 28px 28px 0 0; position: relative; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 0">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C5CDD5"></span>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.05">Which piece is this?</h1>
      <span style="font-size: 13px; color: #5B6672">Showing pieces still in progress</span>
    </div>

    <div style="position: relative">
      <label for="findPiece" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search pieces</label>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6672" stroke-width="1.8" stroke-linecap="round" style="position: absolute; left: 16px; top: 15px"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <input id="findPiece" type="text" placeholder="Search by name, clay or glaze" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 16px; border: 1px solid #D5DBE1; background: #FFFFFF; padding: 0 16px 0 44px; font-size: 15px; color: #16202A; outline-color: #175474">
    </div>

    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 0 -4px; padding: 0 4px">
      <sc-for list="{{pieces}}" as="p" hint-placeholder-count="5">
        <sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{p.pick}}" aria-pressed="true" style="width: 100%; border: 2px solid #175474; background: #FFFFFF; border-radius: 18px; padding: 8px 14px 8px 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; color: #16202A">
            <span style="width: 52px; height: 52px; border-radius: 12px; background: {{p.bg}}; flex: 0 0 auto; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="40" height="40" viewBox="0 0 120 120"><path d="{{p.handle}}" fill="none" stroke="{{p.color}}" stroke-width="8" stroke-linecap="round"></path><path d="{{p.body}}" fill="{{p.color}}"></path></svg>
            </span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; line-height: 1.1">{{p.name}}</span>
              <span style="font-size: 12px; color: #5B6672">{{p.meta}}</span>
            </span>
            <span style="width: 24px; height: 24px; border-radius: 12px; background: #175474; flex: 0 0 auto; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </span>
          </button>
        </sc-if>
        <sc-if value="{{p.off}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{p.pick}}" aria-pressed="false" style="width: 100%; border: 2px solid transparent; background: #FFFFFF; border-radius: 18px; padding: 8px 14px 8px 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; color: #16202A">
            <span style="width: 52px; height: 52px; border-radius: 12px; background: {{p.bg}}; flex: 0 0 auto; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="40" height="40" viewBox="0 0 120 120"><path d="{{p.handle}}" fill="none" stroke="{{p.color}}" stroke-width="8" stroke-linecap="round"></path><path d="{{p.body}}" fill="{{p.color}}"></path></svg>
            </span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; line-height: 1.1">{{p.name}}</span>
              <span style="font-size: 12px; color: #5B6672">{{p.meta}}</span>
            </span>
            <span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid #D5DBE1; box-sizing: border-box; flex: 0 0 auto"></span>
          </button>
        </sc-if>
      </sc-for>
      <a href="Capture.dc.html" style="align-self: center; padding: 12px; font-size: 14px; font-weight: 500">Not here? Save as a new piece</a>
    </div>

    <a href="StageStrip.dc.html" style="flex: 0 0 auto; height: 56px; border-radius: 28px; background: #175474; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">{{nextLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'd' };
  }
  renderVals() {
    var self = this;
    var SH = {
      mug: { body: 'M30 38 h52 v50 a8 8 0 0 1 -8 8 h-36 a8 8 0 0 1 -8 -8 z', handle: 'M82 50 c16 0 16 28 0 28' },
      bowl: { body: 'M14 50 h92 c0 28 -20 44 -46 44 s-46 -16 -46 -44 z', handle: '' },
      vase: { body: 'M51 18 h18 v10 c0 6 16 14 16 36 c0 20 -11 32 -25 32 s-25 -12 -25 -32 c0 -22 16 -30 16 -36 z', handle: '' },
      jar: { body: 'M36 34 c0 -6 48 -6 48 0 v4 c6 4 8 10 8 20 v30 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-30 c0 -10 2 -16 8 -20 z', handle: '' }
    };
    var data = [
      { id: 'd', name: 'Mug Pair', shape: 'mug', meta: 'Trimmed · Best match', color: '#A0907F', bg: '#ECE7E1' },
      { id: 'h', name: 'Lidded Jar', shape: 'jar', meta: 'Trimmed · Day 4', color: '#A0907F', bg: '#ECE7E1' },
      { id: 'e', name: 'Bud Vase', shape: 'vase', meta: 'Thrown · Day 1', color: '#8A7B6E', bg: '#E7E2DC' },
      { id: 'c', name: 'Serving Bowl', shape: 'bowl', meta: 'Bisqued · Day 8', color: '#E8D5C4', bg: '#F3ECE6' },
      { id: 'b', name: 'Tall Vase', shape: 'vase', meta: 'Glazed · Celadon', color: '#9DBBAAB3', bg: '#EEF0EC' }
    ];
    var picked = this.state.picked;
    var name = '';
    var pieces = data.map(function (d) {
      var on = d.id === picked;
      if (on) name = d.name;
      return {
        name: d.name, meta: d.meta, color: d.color, bg: d.bg,
        body: SH[d.shape].body, handle: SH[d.shape].handle,
        on: on, off: !on,
        pick: function () { self.setState({ picked: d.id }); }
      };
    });
    return { pieces: pieces, nextLabel: 'Add to ' + name };
  }
}
</script>
</body>
</html>
