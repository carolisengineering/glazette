<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glazes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#175474}a:hover{color:#0f3a50}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF1F4; font-family: Inter, system-ui, sans-serif; color: #16202A; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 56px 20px 120px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5B6672">Library</span>
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1">Glazes</h1>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; gap: 14px; align-items: center">
        <div style="width: 64px; height: 64px; border-radius: 18px; background: {{sel.color}}; flex: 0 0 auto; position: relative; overflow: hidden">
          <span style="position: absolute; top: 8px; left: 10px; width: 8px; height: 22px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1.05">{{sel.name}}</span>
          <span style="font-size: 13px; color: #5B6672">{{sel.meta}}</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{sel.pots}}" as="p" hint-placeholder-count="3">
          <div style="width: 64px; height: 64px; border-radius: 14px; background: {{p.bg}}; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="46" height="46" viewBox="0 0 120 120"><path d="{{p.handle}}" fill="none" stroke="{{sel.color}}" stroke-width="8" stroke-linecap="round"></path><path d="{{p.body}}" fill="{{sel.color}}"></path></svg>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #16202A">{{sel.tip}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px">
      <sc-for list="{{glazes}}" as="g" hint-placeholder-count="9">
        <button onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #16202A">
          <sc-if value="{{g.on}}" hint-placeholder-val="{{ false }}">
            <span style="width: 92px; height: 112px; border-radius: 16px; box-shadow: 0 0 0 2px #EEF1F4, 0 0 0 4px #175474; display: flex">
              <svg aria-hidden="true" width="92" height="112" viewBox="0 0 80 100"><rect x="4" y="4" width="72" height="92" rx="12" fill="#E8DDD0"></rect><path d="M4 16 a12 12 0 0 1 12 -12 h48 a12 12 0 0 1 12 12 v48 c-6 0 -7 9 -13 9 s-6 -6 -12 -6 s-8 11 -14 11 s-6 -9 -12 -9 s-7 7 -13 5 z" fill="{{g.color}}"></path><ellipse cx="18" cy="26" rx="3" ry="10" fill="rgba(255,255,255,0.32)"></ellipse></svg>
            </span>
          </sc-if>
          <sc-if value="{{g.off}}" hint-placeholder-val="{{ true }}">
            <span style="width: 92px; height: 112px; border-radius: 16px; display: flex">
              <svg aria-hidden="true" width="92" height="112" viewBox="0 0 80 100"><rect x="4" y="4" width="72" height="92" rx="12" fill="#E8DDD0"></rect><path d="M4 16 a12 12 0 0 1 12 -12 h48 a12 12 0 0 1 12 12 v48 c-6 0 -7 9 -13 9 s-6 -6 -12 -6 s-8 11 -14 11 s-6 -9 -12 -9 s-7 7 -13 5 z" fill="{{g.color}}"></path><ellipse cx="18" cy="26" rx="3" ry="10" fill="rgba(255,255,255,0.32)"></ellipse></svg>
            </span>
          </sc-if>
          <span style="font-size: 13px; font-weight: 600">{{g.name}}</span>
          <span style="font-size: 11px; color: #5B6672; margin-top: -4px">{{g.count}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav style="position: absolute; left: 20px; right: 20px; bottom: 28px; height: 68px; background: rgba(22,32,42,0.94); border-radius: 34px; display: flex; align-items: center; justify-content: space-around; padding: 0 10px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #AEB8C2; font-size: 11px; font-weight: 500; width: 72px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AEB8C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M3 20h18M6 10V6h4v4M14 10V4h4v6M6 20v-6h5v6M15 20v-4h3v4"></path></svg>
      Shelf
    </a>
    <a href="Capture.dc.html" aria-label="New piece" style="width: 56px; height: 56px; border-radius: 28px; background: #175474; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 6px 16px rgba(23,84,116,0.45)">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #FFFFFF; font-size: 11px; font-weight: 500; width: 72px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8"><circle cx="7" cy="7" r="3.5"></circle><circle cx="17" cy="7" r="3.5"></circle><circle cx="7" cy="17" r="3.5"></circle><circle cx="17" cy="17" r="3.5"></circle></svg>
      Glazes
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'floating' };
  }
  renderVals() {
    var self = this;
    var SH = {
      mug: { body: 'M30 38 h52 v50 a8 8 0 0 1 -8 8 h-36 a8 8 0 0 1 -8 -8 z', handle: 'M82 50 c16 0 16 28 0 28' },
      bowl: { body: 'M14 50 h92 c0 28 -20 44 -46 44 s-46 -16 -46 -44 z', handle: '' },
      vase: { body: 'M51 18 h18 v10 c0 6 16 14 16 36 c0 20 -11 32 -25 32 s-25 -12 -25 -32 c0 -22 16 -30 16 -36 z', handle: '' },
      jar: { body: 'M36 34 c0 -6 48 -6 48 0 v4 c6 4 8 10 8 20 v30 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-30 c0 -10 2 -16 8 -20 z', handle: '' },
      plate: { body: 'M10 74 h100 c-4 12 -20 18 -50 18 s-46 -6 -50 -18 z', handle: '' }
    };
    var data = [
      { id: 'floating', name: 'Floating Blue', color: '#2F5D7C', cone: 'Cone 6', pots: ['bowl', 'bowl', 'mug'], tip: 'Pools darker in the trim lines. Best over stoneware.' },
      { id: 'oatmeal', name: 'Oatmeal', color: '#D8C7A6', cone: 'Cone 6', pots: ['mug', 'jar'], tip: 'Shows off speckled clay. Two dips max.' },
      { id: 'celadon', name: 'Celadon', color: '#9DBBAA', cone: 'Cone 6', pots: ['vase', 'jar'], tip: 'Glassy on porcelain, muddy on dark clay.' },
      { id: 'tenmoku', name: 'Tenmoku', color: '#3A2A20', cone: 'Cone 6', pots: ['mug', 'plate'], tip: 'Breaks rust-brown on edges. Thick application.' },
      { id: 'shino', name: 'Shino', color: '#C96F4A', cone: 'Cone 6', pots: ['vase'], tip: 'Still testing. Try thinner next time.' },
      { id: 'copper', name: 'Copper Red', color: '#8E2F2F', cone: 'Cone 10', pots: ['bowl'], tip: 'Needs reduction. Shared studio firing only.' },
      { id: 'matte', name: 'Matte White', color: '#F1EEE7', cone: 'Cone 6', pots: ['plate', 'mug'], tip: 'Great liner under Floating Blue.' },
      { id: 'iron', name: 'Iron Red', color: '#7A3B22', cone: 'Cone 6', pots: ['jar'], tip: 'Goes black where it runs thick.' },
      { id: 'clear', name: 'Clear', color: '#DCE3E4', cone: 'Cone 6', pots: ['mug', 'bowl', 'plate'], tip: 'Liner glaze for all food-safe interiors.' }
    ];
    var picked = this.state.picked;
    var s = data.filter(function (d) { return d.id === picked; })[0] || data[0];
    var BG = ['#E6ECF0', '#E7E2DC', '#EEF0EC'];
    var sel = {
      name: s.name,
      color: s.color,
      tip: s.tip,
      meta: s.cone + ' · used on ' + s.pots.length + (s.pots.length === 1 ? ' piece' : ' pieces'),
      pots: s.pots.map(function (k, i) { return { body: SH[k].body, handle: SH[k].handle, bg: BG[i % 3] }; })
    };
    var glazes = data.map(function (d) {
      var on = d.id === picked;
      return {
        name: d.name, color: d.color, on: on, off: !on, pressed: on ? 'true' : 'false',
        count: d.pots.length + (d.pots.length === 1 ? ' piece' : ' pieces'),
        pick: function () { self.setState({ picked: d.id }); }
      };
    });
    return { sel: sel, glazes: glazes };
  }
}
</script>
</body>
</html>
